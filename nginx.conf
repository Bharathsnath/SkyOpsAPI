server {
    listen 80;
    server_name skyopsapibeta.akbartravelsonline.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skyopsapibeta.akbartravelsonline.com;

    ssl_certificate     /etc/ssl/certs/skyopsapibeta.crt;
    ssl_certificate_key /etc/ssl/private/skyopsapibeta.key;

    # SignalR WebSocket endpoint
    location /queue-notifications {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # All other API routes
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
